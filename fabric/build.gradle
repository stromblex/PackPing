plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

sourceSets {
    main {
        java {
            srcDir '../common/src/main/java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

def mcVersionLabel = rootProject.hasProperty('mc_label')
        ? "mc${rootProject.mc_label}"
        : rootProject.minecraft_version == rootProject.minecraft_version_max
        ? "mc${rootProject.minecraft_version}"
        : "mc${rootProject.minecraft_version}-${rootProject.minecraft_version_max}"

jar {
    archiveBaseName = 'packping'
    archiveAppendix = 'fabric'
    archiveVersion = "${mcVersionLabel}-${project.version}"
}
